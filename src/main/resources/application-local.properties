spring.datasource.url=jdbc:postgresql://localhost:5432/epic_order_service

spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

user.service.url=http://localhost:8081
server.port=8082

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=DEBUG

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=order-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=by.nikiforova.epic_order_service.kafka.event.CreatePaymentEvent

kafka.topic.create-payment=CREATE_PAYMENT