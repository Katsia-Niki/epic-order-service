spring.application.name=epic-order-service

spring.jpa.hibernate.ddl-auto=validate

spring.datasource.driver-class-name=org.postgresql.Driver

jwt.secret=${JWT_SECRET}

spring.cache.type=redis
spring.cache.redis.time-to-live=3600000

resilience4j.circuitbreaker.instances.userService.ignoreExceptions=by.nikiforova.epic_order_service.exception.EntityNotFoundException

kafka.topic.create-payment=CREATE_PAYMENT

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true