databaseChangeLog:
  - changeSet:
      id: 002-create-orders-table
      author: nikiforova
      changes:
        - createTable:
            tableName: orders
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: total_price
                  type: DECIMAL(10, 2)
                  constraints:
                    nullable: false
              - column:
                  name: deleted
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
        - createIndex:
            indexName: idx_orders_user_id_deleted
            tableName: orders
            columns:
              - column:
                  name: user_id
              - column:
                  name: deleted
        - createIndex:
            indexName: idx_orders_deleted_status_created_at
            tableName: orders
            columns:
              - column:
                  name: deleted
              - column:
                  name: status
              - column:
                  name: created_at